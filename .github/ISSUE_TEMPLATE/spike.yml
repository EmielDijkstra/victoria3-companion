name: Spike / research
description: A question to answer before building / Een vraag die beantwoord moet worden voordat we bouwen
labels: [spike]
body:
  - type: textarea
    id: question
    attributes:
      label: Question / Vraag
      description: What do we want to know?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Approach / Aanpak
      description: How do we find out? What do we try?
  - type: textarea
    id: done
    attributes:
      label: Done when / Klaar als
      description: When do we know enough? One checkable point per line.
      value: |
        - [ ] Report in `docs/spikes/` with question, approach, result and recommendation
    validations:
      required: true
