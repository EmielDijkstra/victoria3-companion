name: Task / feature
description: New functionality, data, explanation or infrastructure task / Nieuwe functionaliteit of taak
labels: []
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As <who> I want <what>, so that <why>. / Als <wie> wil ik <wat>, zodat <waarom>.
      placeholder: As a player I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria / Acceptatiecriteria
      description: When is this done? One checkable point per line.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes / Technische notities
      description: Approach, sources, dependencies (optional)
