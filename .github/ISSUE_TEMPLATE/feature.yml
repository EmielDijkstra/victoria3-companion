name: Taak / feature
description: Nieuwe functionaliteit, data-, uitleg- of infrataak
labels: []
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Als <wie> wil ik <wat>, zodat <waarom>.
      placeholder: Als speler wil ik ..., zodat ...
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptatiecriteria
      description: Wanneer is dit klaar? Eén controleerbaar punt per regel.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technische notities
      description: Aanpak, bronnen, afhankelijkheden (optioneel)
